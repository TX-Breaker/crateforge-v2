<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <!-- Favicon: disegno D della specifica logo §03 (due dorsi), l'unico che
         regge 16 pixel. Incorporata come data: URI perché la CSP vieta le
         risorse remote e un file in più per mezzo kilobyte non si giustifica. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23E8912E'/%3E%3Cpath d='M15 18V42a5 5 0 0 0 5 5h24a5 5 0 0 0 5-5V18' stroke='%230A0B0D' stroke-width='8' stroke-linecap='square' fill='none'/%3E%3Crect x='24' y='29' width='7' height='16' rx='1' fill='%230A0B0D'/%3E%3Crect x='34' y='25' width='7' height='20' rx='1' fill='%230A0B0D'/%3E%3C/svg%3E"
    />
    <title>CrateForge</title>
  </head>
  <body>
    <!-- Schermata di avvio, sostituita da React al primo render.
         È la resa "One ink" della specifica §04: qui i token del tema non
         esistono ancora — il CSS deve ancora arrivare e la palette la sceglie
         l'utente — quindi un solo inchiostro è l'unica resa onesta possibile.
         Il marchio NON si anima: un logo che gira mentre si legge una libreria
         dice che il logo è occupato, e la barra dei job dice la verità. -->
    <div id="root">
      <div
        style="
          display: grid;
          place-items: center;
          height: 100vh;
          background: #0a0b0d;
          color: #6e757e;
        "
      >
        <svg
          width="64"
          height="64"
          viewBox="0 0 64 64"
          fill="none"
          role="img"
          aria-label="CrateForge"
        >
          <path
            d="M10 13V45a6 6 0 0 0 6 6h32a6 6 0 0 0 6-6V13"
            stroke="currentColor"
            stroke-width="6"
            stroke-linecap="square"
          />
          <rect x="18.5" y="26" width="7" height="22" rx="1.5" fill="currentColor" />
          <rect x="28.5" y="20" width="7" height="28" rx="1.5" fill="currentColor" />
          <rect x="38.5" y="30" width="7" height="18" rx="1.5" fill="currentColor" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
