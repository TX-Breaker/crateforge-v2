appId: com.txbreaker.crateforge
productName: CrateForge
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  # Sidecar PyInstaller --onedir (meno falsi positivi antivirus di --onefile).
  # La cartella viene prodotta da python-sidecar/build_sidecar.(sh|ps1).
  - from: python-sidecar/dist/crateforge-sidecar
    to: sidecar
    filter: ['**/*']
  - from: assets
    to: assets
    filter: ['**/*']
asarUnpack:
  - '**/*.node'
npmRebuild: true
mac:
  target:
    - dmg
    - zip
  category: public.app-category.music
  # Squircle con margine del 10%, generata da scripts/make-icons.cjs a partire
  # dai quattro disegni del marchio: nessun ricampionamento di un unico PNG.
  icon: build/icon.png
  # Build locali non firmati: warning Gatekeeper atteso (vedi README).
  identity: null
win:
  target:
    - nsis
    - portable
  # .ico multi-misura: 16 e 24 usano il disegno a due dorsi, 32 quello a tratto
  # pesante, da 48 in su la geometria piena (specifica logo §03).
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
