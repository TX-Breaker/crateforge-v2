appId: com.txbreaker.crateforge
productName: CrateForge
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  # Sidecar PyInstaller --onedir (meno falsi positivi antivirus di --onefile).
  # La cartella viene prodotta da python-sidecar/build_sidecar.(sh|ps1).
  - from: python-sidecar/dist/crateforge-sidecar
    to: sidecar
    filter: ['**/*']
  - from: assets
    to: assets
    filter: ['**/*']
asarUnpack:
  - '**/*.node'
npmRebuild: true
mac:
  target:
    - dmg
    - zip
  category: public.app-category.music
  # .icns con dieci slot, ognuno generato dal proprio disegno (§08 della
  # specifica logo): ricampionare un 1024 lungo la scala rimetterebbe la
  # poltiglia che i quattro disegni esistono per evitare.
  icon: build/icon.icns
  # Build locali non firmati: warning Gatekeeper atteso (vedi README).
  identity: null
win:
  target:
    - nsis
    - portable
  # .ico a sette misure: 16 col disegno a due dorsi, 20 e 24 col disegno
  # stretto, 32 col tratto pesante, da 48 in su la geometria piena (§08).
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
